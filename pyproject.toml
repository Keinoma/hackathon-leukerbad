[project]
name = "leukerbad-object-detection-robotics"
version = "0.1.0"
description = "Object detection and robotic arm control experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luca Reiter" }]
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
]

[project.optional-dependencies]
ml = [
    "ultralytics>=8.3.0",
]
robotics = [
    "pyserial>=3.5",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
leukerbad-detect = "leukerbad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leukerbad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
